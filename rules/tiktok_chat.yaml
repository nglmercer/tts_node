# @import data from '../../data/chat.json'
# Chat comment rule - TTS processing with quality filtering
# Quality filter configuration is in plugins/ai/constants.ts
- id: rule-id
  on: chat
  if:
    operator: AND
    conditions:
      # Evita duplicados: compara el último mensaje con el actual
      - field: ${vars.clean(data.comment)}
        operator: NEQ
        value: ${vars.clean(vars.last())}

      # Evita mensajes vacíos después de limpiar
      - field: ${vars.clean(data.comment)}
        operator: NOT_IN
        value: ["", null, undefined]
      
      # Longitud mínima para procesar
      - field: ${vars.clean(data.comment).length}
        operator: GT
        value: 3
  do:
    mode: SEQUENCE
    actions:
      - if:
          field: data.comment
          operator: CONTAINS
          value: ['!ai', '!ia', 'AI', 'IA']
        else:
          # - type: TTS
          #   params:
          #     message: ${data.comment}
          - type: TTS
            params:
              message: "${data.comment}"
              user: ${data.nickname}
        then:
          - type: ai_respond
            params:
              prompt: "User ${data.nickname} PREGUNTA: ${data.comment}"
              user: ${data.nickname}