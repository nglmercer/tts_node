# @import data from '../../data/chat.json'
# chat comment with quality filtering
- id: rule-id
  on: chat
  if:
    operator: AND
    conditions:
      - field: ${data.comment}
        #this value is a command to trigger the ai
        operator: CONTAINS
        value: ["!ia","!ai"]
      # Compara el último guardado (limpio) con el actual limpio
      - field: ${vars.clean(data.comment)}
        operator: NEQ
        value: ${vars.clean(vars.last())}

      # Evita mensajes vacíos después de limpiar
      - field: ${vars.clean(data.comment)}
        operator: NOT_IN
        value: ["", null, undefined]
      
      # si es un comentario corto
      - field: ${vars.clean(data.comment).length}
        operator: GT
        value: 3

  do:
    mode: SEQUENCE
    actions:
      - type: AI_RESPOND
        params:
          prompt: ${data.comment}
      - type: log
        params:
          message: "AI response: ${data.comment}"
